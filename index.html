<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>كويز قيم | QUIZ GAME PRO</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3407/3407024.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --main: #6c5ce7; --bg: #0f0c29; --accent: #00d2ff; --white: #ffffff; --success: #00b894; --danger: #ff7675; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body { background: var(--bg); height: 100%; overflow: hidden; width: 100%; position: fixed; }

        .screen { width: 100%; max-width: 500px; height: 100%; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); display: none; flex-direction: column; padding: 20px; position: relative; margin: 0 auto; }
        .active { display: flex; }

        .logo { font-size: 60px; font-weight: 900; background: linear-gradient(to right, #00d2ff, #92fe9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 50px; }
        
        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; color: white; width: 100%; margin-bottom: 10px; outline: none; }
        button { width: 100%; padding: 14px; background: var(--main); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }

        #custom-toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 8px 20px; border-radius: 50px; font-weight: bold; z-index: 5000; display: none; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; margin-bottom: 10px; }
        .score { font-size: 20px; font-weight: 900; color: var(--accent); }
        .turn-badge { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; text-align: center; }
        .my-turn { background: var(--success); color: #000; }
        .opp-turn { background: rgba(255,255,255,0.1); color: #aaa; }

        .question-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        #q-options { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .opt-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 6px; color: white; width: 100%; text-align: right; }

        /* تعديل منطقة الشات لتناسب الجوال */
        .chat-area { height: 150px; background: rgba(0,0,0,0.4); border-radius: 15px 15px 0 0; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); margin: 0 -20px; margin-top: auto; padding-bottom: env(safe-area-inset-bottom); }
        #chat-content { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
        .msg-line { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 8px; width: fit-content; max-width: 80%; color: #fff; }
        .chat-box { display: flex; padding: 8px; gap: 5px; background: rgba(0,0,0,0.3); }
        .chat-box input { margin: 0; padding: 6px; font-size: 12px; flex: 1; }
        .chat-box button { width: 60px; padding: 6px; font-size: 12px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 20px; }
        .modal-content { background: #1a1a2e; padding: 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div id="custom-toast">تنبيه</div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="end-title">النتيجة</h2>
            <p id="end-msg" style="margin: 10px 0; color: #ccc;"></p>
            <p id="total-time" style="font-size: 14px; margin-bottom: 20px; color: var(--accent);"></p>
            <button onclick="location.reload()" style="background: var(--accent); color: #000;">الرئيسية</button>
        </div>
    </div>

    <div id="screen-splash" class="screen active" style="justify-content: center;">
        <div class="logo">QUIZ<br>GAME</div>
        <button onclick="showScreen('screen-profile')">دخول اللعبة</button>
    </div>

    <div id="screen-profile" class="screen" style="justify-content: center;">
        <h2 style="text-align: center; margin-bottom: 20px;">👤 إعداد اللاعب</h2>
        <input type="text" id="p-name" placeholder="أدخل اسمك المستعار">
        <button onclick="saveProfile()">حفظ واستمرار</button>
    </div>

    <div id="screen-menu" class="screen" style="justify-content: center;">
        <h2 id="welcome-txt" style="margin-bottom: 20px; text-align: center;">أهلاً بك</h2>
        <div id="room-code-display" style="display:none; text-align:center; margin-bottom:15px; padding:10px; border:1px dashed var(--accent); border-radius:10px;">
            <b id="display-code" style="font-size: 24px; color: var(--accent);">----</b>
            <p style="font-size:10px; color:#aaa;">أرسل الكود لصديقك</p>
        </div>
        <select id="game-limit">
            <option value="10">10 نقاط</option>
            <option value="20">20 نقطة</option>
            <option value="50">50 نقطة</option>
        </select>
        <button onclick="createNewGame()">➕ إنشاء غرفة</button>
        <div style="height: 15px;"></div>
        <input type="text" id="join-code" placeholder="كود الصديق">
        <button style="background: #2d3436;" onclick="joinExistingGame()">🤝 انضمام</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="status-bar">
            <div style="text-align:center;"><span id="my-name" style="font-size:10px; color:#aaa;">أنت</span><br><span id="my-score" class="score">0</span></div>
            <div id="turn-indicator" class="turn-badge"><span id="turn-text">...</span><br><span id="game-timer">00:00</span></div>
            <div style="text-align:center;"><span id="opp-name" style="font-size:10px; color:#aaa;">الخصم</span><br><span id="opp-score" class="score">0</span></div>
        </div>
        <div class="question-card"><h3 id="q-text" style="font-size: 16px;">...</h3></div>
        <div id="q-options"></div>
        <div class="chat-area">
            <div id="chat-content"></div>
            <div class="chat-box">
                <input type="text" id="chat-input" placeholder="رسالة..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // بنك الأسئلة (نفس الأسئلة السابقة)
        const questionsList = [
            { q: "كم عدد لاعبي فريق كرة القدم في الملعب؟", opts: ["9", "10", "11", "12"], a: 2 },
            { q: "ما هي عاصمة السعودية؟", opts: ["جدة", "الرياض", "الدمام", "مكة"], a: 1 },
            { q: "ما هو أكبر كوكب في المجموعة الشمسية؟", opts: ["زحل", "المشتري", "نبتون", "الأرض"], a: 1 },
            { q: "ما هو المعدن السائل في درجة حرارة الغرفة؟", opts: ["الحديد", "النحاس", "الزئبق", "الرصاص"], a: 2 },
            { q: "كم عدد قارات العالم؟", opts: ["5", "6", "7", "8"], a: 2 },
            { q: "ما هي عاصمة اليابان؟", opts: ["طوكيو", "بكين", "سيول", "بانكوك"], a: 0 },
            { q: "ما هو أطول نهر في العالم؟", opts: ["الأمازون", "النيل", "الميسيسيبي", "الكونغو"], a: 1 },
            { q: "ما هو الكوكب الأحمر؟", opts: ["زحل", "المريخ", "المشتري", "الزهرة"], a: 1 },
            { q: "من هو مخترع المصباح؟", opts: ["نيوتن", "أديسون", "أينشتاين", "تسلا"], a: 1 },
            { q: "ما هو أسرع حيوان بري؟", opts: ["الأسد", "النمر", "الفهد", "الغزال"], a: 2 }
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCK_BB_V24ML_mtysxEHZiKOcll9wlPhlg",
            authDomain: "quizgame-e2f19.firebaseapp.com",
            databaseURL: "https://quizgame-e2f19-default-rtdb.firebaseio.com",
            projectId: "quizgame-e2f19",
            storageBucket: "quizgame-e2f19.firebasestorage.app",
            messagingSenderId: "568663112844",
            appId: "1:568663112844:web:de66ced5cf2dfa8fb1cfa9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerInfo = { name: "", id: Math.random().toString(36).substr(2, 9) };
        let roomID = null, isHost = false, myTurn = false;
        let timerInterval = null, startTime = null;

        function showToast(msg) {
            const t = document.getElementById('custom-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            playerInfo.name = document.getElementById('p-name').value.trim();
            if(!playerInfo.name) return showToast("⚠️ اكتب اسمك");
            document.getElementById('welcome-txt').innerText = `أهلاً ${playerInfo.name}`;
            showScreen('screen-menu');
        }

        function createNewGame() {
            roomID = Math.random().toString(36).substr(2, 5).toUpperCase();
            isHost = true;
            document.getElementById('room-code-display').style.display = 'block';
            document.getElementById('display-code').innerText = roomID;
            const targetScore = parseInt(document.getElementById('game-limit').value);
            db.ref('rooms/' + roomID).set({
                host: playerInfo, turn: playerInfo.id, qIndex: 0,
                scores: { [playerInfo.id]: 0 }, status: "waiting", limit: targetScore,
                qOrder: questionsList.map((_, i) => i).sort(() => Math.random() - 0.5)
            });
            listenToRoom();
        }

        function joinExistingGame() {
            roomID = document.getElementById('join-code').value.toUpperCase().trim();
            if(!roomID) return showToast("⚠️ أدخل الكود");
            db.ref('rooms/' + roomID).once('value', snapshot => {
                if(snapshot.exists()) {
                    isHost = false;
                    db.ref('rooms/' + roomID + '/guest').set(playerInfo);
                    db.ref('rooms/' + roomID + '/scores/' + playerInfo.id).set(0);
                    db.ref('rooms/' + roomID + '/status').set("playing");
                    listenToRoom();
                } else { showToast("❌ كود خاطئ"); }
            });
        }

        function listenToRoom() {
            db.ref('rooms/' + roomID).on('value', snapshot => {
                const data = snapshot.val(); if(!data) return;
                if(data.status === "finished") { clearInterval(timerInterval); showEndModal(data.winnerName); return; }
                if(data.status === "playing") {
                    showScreen('screen-game');
                    if(!startTime) { startTime = Date.now(); startTimer(); }
                }
                if(data.scores) {
                    Object.keys(data.scores).forEach(id => {
                        document.getElementById(id === playerInfo.id ? 'my-score' : 'opp-score').innerText = data.scores[id];
                    });
                }
                if(data.guest && data.host) {
                    document.getElementById('opp-name').innerText = isHost ? data.guest.name : data.host.name;
                }
                myTurn = (data.turn === playerInfo.id);
                document.getElementById('turn-text').innerText = myTurn ? "دورك الآن" : "انتظر الخصم";
                document.getElementById('turn-indicator').className = "turn-badge " + (myTurn ? "my-turn" : "opp-turn");

                const q = questionsList[data.qOrder[data.qIndex % questionsList.length]];
                updateUI(q);
            });
            db.ref('chats/' + roomID).on('child_added', s => {
                const m = s.val();
                const d = document.createElement('div'); d.className = "msg-line";
                d.style.alignSelf = m.user === playerInfo.name ? "flex-start" : "flex-end";
                d.innerHTML = `<b style="color:var(--accent); font-size:9px;">${m.user}</b><br>${m.text}`;
                const content = document.getElementById('chat-content');
                content.appendChild(d); content.scrollTop = content.scrollHeight;
            });
        }

        function updateUI(q) {
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options'); container.innerHTML = "";
            q.opts.forEach((opt, i) => {
                const b = document.createElement('button'); b.className = "opt-btn";
                b.innerText = opt; b.disabled = !myTurn;
                b.onclick = () => {
                    if(i === q.a) {
                        showToast("✅ إجابة صحيحة!");
                        db.ref('rooms/' + roomID).once('value', snap => {
                            const rd = snap.val(); const ns = (rd.scores[playerInfo.id] || 0) + 1;
                            db.ref('rooms/' + roomID + '/scores/' + playerInfo.id).set(ns);
                            if(ns >= rd.limit) db.ref('rooms/' + roomID).update({ status: "finished", winnerName: playerInfo.name });
                            else db.ref('rooms/' + roomID + '/qIndex').transaction(x => (x || 0) + 1);
                        });
                    } else {
                        showToast("❌ إجابة خاطئة!");
                        db.ref('rooms/' + roomID).once('value', snap => {
                            const d = snap.val(); const next = isHost ? (d.guest ? d.guest.id : d.host.id) : d.host.id;
                            db.ref('rooms/' + roomID + '/turn').set(next);
                        });
                    }
                };
                container.appendChild(b);
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(diff / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                document.getElementById('game-timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function sendMessage() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            db.ref('chats/' + roomID).push({ user: playerInfo.name, text: inp.value });
            inp.value = "";
        }

        function showEndModal(winnerName) {
            document.getElementById('end-title').innerText = winnerName === playerInfo.name ? "🏆 فزت!" : "💔 خسرت";
            document.getElementById('end-msg').innerText = "الفائز: " + winnerName;
            document.getElementById('total-time').innerText = "الوقت: " + document.getElementById('game-timer').innerText;
            document.getElementById('game-over-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
