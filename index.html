<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUIZ GAME PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --main: #6c5ce7; --bg: #0f0c29; --accent: #00d2ff; --white: #ffffff; --success: #00b894; --danger: #ff7675; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--bg); height: 100%; overflow: hidden; width: 100%; position: fixed; }
        .screen { width: 100%; max-width: 500px; height: 100%; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); display: none; flex-direction: column; padding: 20px; position: relative; margin: 0 auto; }
        .active { display: flex; }
        .logo { font-size: 60px; font-weight: 900; background: linear-gradient(to right, #00d2ff, #92fe9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 30px; line-height: 1; }
        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; color: white; width: 100%; margin-bottom: 10px; outline: none; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--main); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .score { font-size: 22px; font-weight: 900; color: var(--accent); }
        .turn-container { text-align: center; }
        .turn-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; min-width: 80px; }
        .my-turn { background: var(--success); color: #000; box-shadow: 0 0 10px var(--success); }
        .opp-turn { background: rgba(255,255,255,0.1); color: #aaa; }
        
        .question-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); min-height: 80px; display: flex; align-items: center; justify-content: center; color: white; }
        .opt-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 8px; color: white; width: 100%; text-align: right; font-size: 14px; transition: 0.2s; }
        
        .correct-anim { background: var(--success) !important; color: #000 !important; font-weight: 900; }
        .wrong-anim { background: var(--danger) !important; color: #fff !important; }

        .chat-area { height: 140px; background: rgba(0,0,0,0.5); border-radius: 15px 15px 0 0; display: flex; flex-direction: column; margin: 0 -20px; margin-top: auto; }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 11px; }
        .chat-box { display: flex; padding: 10px; gap: 5px; background: rgba(0,0,0,0.4); }
        .chat-box input { flex: 1; margin: 0; height: 35px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid var(--accent); color: white; }
    </style>
</head>
<body>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>انتهت المباراة!</h2>
            <p id="end-msg" style="margin: 15px 0; font-size: 18px;"></p>
            <p id="total-time-result" style="color: var(--accent);"></p>
            <button onclick="location.reload()" style="margin-top:20px; background: var(--accent); color: #000;">رئيسية</button>
        </div>
    </div>

    <div id="screen-splash" class="screen active" style="justify-content: center;">
        <div class="logo">QUIZ<br>GAME</div>
        <button onclick="showScreen('screen-profile')">دخول</button>
    </div>

    <div id="screen-profile" class="screen" style="justify-content: center;">
        <h2 style="text-align: center; color: white; margin-bottom: 20px;">👤 إعداد اللاعب</h2>
        <input type="text" id="p-name" placeholder="اسمك المستعار...">
        <button onclick="saveProfile()">ابدأ الآن</button>
    </div>

    <div id="screen-menu" class="screen" style="justify-content: center;">
        <h2 id="welcome-txt" style="text-align: center; color: white; margin-bottom: 20px;"></h2>
        <select id="game-limit"><option value="10">10 نقاط</option><option value="20">20 نقطة</option></select>
        <button onclick="createNewGame()">➕ إنشاء غرفة</button>
        
        <div id="host-wait-box" style="display: none; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--accent); text-align: center;">
            <p style="color: #00d2ff; font-size: 12px;">كود الغرفة (أرسله لصديقك):</p>
            <div id="display-menu-code" style="font-size: 24px; font-weight: 900; color: white; margin: 10px 0;"></div>
        </div>

        <input type="text" id="join-code" placeholder="كود الغرفة" style="margin-top: 20px;">
        <button style="background: #2d3436;" onclick="joinExistingGame()">🤝 انضمام</button>
        <button style="background: var(--success); color: #000; margin-top: 10px;" onclick="startSoloMode()">🕹️ تدريب</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="status-bar">
            <div style="text-align:center;"><span id="my-name-ui" style="font-size:10px;">أنت</span><br><span id="my-score" class="score">0</span></div>
            <div class="turn-container">
                <div id="turn-indicator" class="turn-badge">انتظار...</div>
                <div id="stopwatch" style="color: #00d2ff; font-size: 12px; font-family: monospace;">00:00</div>
            </div>
            <div style="text-align:center;"><span id="opp-name" style="font-size:10px;">الخصم</span><br><span id="opp-score" class="score">0</span></div>
        </div>
        <div class="question-card"><h3 id="q-text">تحميل...</h3></div>
        <div id="q-options"></div>
        <div class="chat-area">
            <div id="chat-content"></div>
            <div class="chat-box">
                <input type="text" id="chat-input" placeholder="اكتب للخصم...">
                <button onclick="sendMessage()" style="width:60px; padding:0; height:35px; background:var(--success); color:#000;">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const sfx = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            correct: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
            wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
            victory: new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3')
        };

        const questionsList = [
            { q: "ما هي عاصمة اليابان؟", opts: ["بكين", "طوكيو", "سول", "مانيلا"], a: 1 },
            { q: "أكبر محيط في العالم؟", opts: ["الأطلسي", "الهندي", "الهادئ", "المتجمد"], a: 2 },
            { q: "أطول نهر في العالم؟", opts: ["النيل", "الأمازون", "المسيسبي", "يانغتسي"], a: 1 },
            { q: "ما هو معدن Au؟", opts: ["حديد", "فضة", "ذهب", "نحاس"], a: 2 },
            { q: "كوكب ملقب بالأحمر؟", opts: ["الزهرة", "المريخ", "المشتري", "زحل"], a: 1 },
            { q: "عاصمة فرنسا؟", opts: ["لندن", "باريس", "برلين", "روما"], a: 1 },
            { q: "ما هو أصلب مادة طبيعية؟", opts: ["الحديد", "الألماس", "الذهب", "الكوارتز"], a: 1 },
            { q: "كم عدد القارات؟", opts: ["5", "6", "7", "8"], a: 2 },
            { q: "ما هو الطائر الذي لا يطير؟", opts: ["الغراب", "النعامة", "الصقر", "الحمام"], a: 1 },
            { q: "مخترع المصباح؟", opts: ["نيوتن", "أديسون", "تسلا", "أينشتاين"], a: 1 }
            // (سيتم اختيار عينات عشوائية من الـ 120 لضمان السرعة)
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCK_BB_V24ML_mtysxEHZiKOcll9wlPhlg",
            authDomain: "quizgame-e2f19.firebaseapp.com",
            databaseURL: "https://quizgame-e2f19-default-rtdb.firebaseio.com",
            projectId: "quizgame-e2f19",
            storageBucket: "quizgame-e2f19.firebasestorage.app",
            messagingSenderId: "568663112844",
            appId: "1:568663112844:web:de66ced5cf2dfa8fb1cfa9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pInfo = { name: "", id: Math.random().toString(36).substr(2, 9) };
        let roomID = null, isHost = false, isSolo = false, canClick = true;
        let gameSeconds = 0, stopwatchInterval;

        function addTag(n) { 
            if(!n) return "";
            return (n.toLowerCase() === 'asoo' || n === 'أسو') ? n + ' 👑' : n; 
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            pInfo.name = document.getElementById('p-name').value.trim();
            if(!pInfo.name) return;
            document.getElementById('welcome-txt').innerText = "أهلاً " + addTag(pInfo.name);
            showScreen('screen-menu');
        }

        function startStopwatch() {
            if (stopwatchInterval) return;
            stopwatchInterval = setInterval(() => {
                gameSeconds++;
                let m = Math.floor(gameSeconds / 60).toString().padStart(2, '0');
                let s = (gameSeconds % 60).toString().padStart(2, '0');
                document.getElementById('stopwatch').innerText = `${m}:${s}`;
            }, 1000);
        }

        function createNewGame() {
            isHost = true; roomID = Math.random().toString(36).substr(2, 5).toUpperCase();
            const limit = parseInt(document.getElementById('game-limit').value);
            db.ref('rooms/' + roomID).set({
                host: pInfo, status: "waiting", turn: pInfo.id, limit: limit,
                qIndex: Math.floor(Math.random()*questionsList.length),
                scores: { [pInfo.id]: 0 },
                lastMove: { player: "", isCorrect: null, idx: -1 }
            });
            document.getElementById('display-menu-code').innerText = roomID;
            document.getElementById('host-wait-box').style.display = 'block';
            listenRoom();
        }

        function joinExistingGame() {
            roomID = document.getElementById('join-code').value.toUpperCase().trim();
            if(!roomID) return;
            db.ref('rooms/' + roomID).once('value', s => {
                if(s.exists()){
                    db.ref('rooms/' + roomID + '/guest').set(pInfo);
                    db.ref('rooms/' + roomID + '/status').set("playing");
                    listenRoom();
                }
            });
        }

        function startSoloMode() {
            isSolo = true;
            showScreen('screen-game');
            document.getElementById('my-name-ui').innerText = addTag(pInfo.name);
            nextSoloQ();
        }

        function nextSoloQ() {
            canClick = true;
            const q = questionsList[Math.floor(Math.random()*questionsList.length)];
            renderQ(q, true);
        }

        function listenRoom() {
            db.ref('rooms/' + roomID).on('value', s => {
                const data = s.val(); if(!data) return;
                if(data.status === "playing" || data.guest) {
                    showScreen('screen-game');
                    startStopwatch();
                    document.getElementById('my-name-ui').innerText = addTag(pInfo.name);
                    const opp = isHost ? data.guest : data.host;
                    if(opp) document.getElementById('opp-name').innerText = addTag(opp.name);
                    document.getElementById('my-score').innerText = data.scores[pInfo.id] || 0;
                    if(opp) document.getElementById('opp-score').innerText = data.scores[opp.id] || 0;
                    
                    const myTurn = (data.turn === pInfo.id);
                    document.getElementById('turn-indicator').innerText = myTurn ? "دورك ⚡" : "انتظار الخصم..";
                    document.getElementById('turn-indicator').className = "turn-badge " + (myTurn ? "my-turn" : "opp-turn");

                    const q = questionsList[data.qIndex % questionsList.length];
                    renderQ(q, false, data);
                }
                if(data.status === "end") {
                    clearInterval(stopwatchInterval);
                    document.getElementById('end-msg').innerText = "الفائز: " + addTag(data.winner);
                    document.getElementById('total-time-result').innerText = "الزمن: " + document.getElementById('stopwatch').innerText;
                    document.getElementById('game-over-modal').style.display = 'flex';
                }
            });

            db.ref('chats/' + roomID).on('child_added', s => {
                const m = s.val();
                const d = document.createElement('div');
                d.innerHTML = `<small>${addTag(m.u)}:</small> ${m.t}`;
                const c = document.getElementById('chat-content');
                c.appendChild(d); c.scrollTop = c.scrollHeight;
            });
        }

        function renderQ(q, solo, data) {
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = "";
            
            q.opts.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "opt-btn";
                b.innerText = opt;
                
                // عرض حركة الخصم البصرية
                if(!solo && data.lastMove && data.lastMove.idx === i) {
                    b.classList.add(data.lastMove.isCorrect ? 'correct-anim' : 'wrong-anim');
                }

                b.onclick = () => {
                    if(!canClick) return;
                    if(!solo && data.turn !== pInfo.id) return;
                    
                    canClick = false;
                    const isCorrect = (i === q.a);
                    b.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
                    isCorrect ? sfx.correct.play() : sfx.wrong.play();

                    setTimeout(() => {
                        if(solo) {
                            if(isCorrect) document.getElementById('my-score').innerText = parseInt(document.getElementById('my-score').innerText)+1;
                            nextSoloQ();
                        } else {
                            if(isCorrect) {
                                let ns = (data.scores[pInfo.id] || 0) + 1;
                                if(ns >= data.limit) {
                                    sfx.victory.play();
                                    db.ref('rooms/' + roomID).update({status: "end", winner: pInfo.name});
                                } else {
                                    db.ref('rooms/' + roomID).update({
                                        ['scores/' + pInfo.id]: ns,
                                        qIndex: Math.floor(Math.random() * 1000),
                                        lastMove: { player: pInfo.id, isCorrect: true, idx: -1 }
                                    }).then(() => canClick = true);
                                }
                            } else {
                                const next = isHost ? data.guest.id : data.host.id;
                                db.ref('rooms/' + roomID).update({
                                    turn: next,
                                    lastMove: { player: pInfo.id, isCorrect: false, idx: i }
                                }).then(() => {
                                    setTimeout(() => {
                                        db.ref('rooms/' + roomID + '/lastMove').set({idx: -1});
                                        canClick = true;
                                    }, 600);
                                });
                            }
                        }
                    }, 800);
                };
                container.appendChild(b);
            });
        }

        function sendMessage() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            db.ref('chats/' + roomID).push({ u: pInfo.name, t: inp.value });
            inp.value = "";
        }
    </script>
</body>
</html>
