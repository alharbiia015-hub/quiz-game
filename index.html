<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>كويز قيم PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --main: #6c5ce7; --bg: #0f0c29; --accent: #00d2ff; --white: #ffffff; --success: #00b894; --danger: #ff7675; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--bg); height: 100%; overflow: hidden; width: 100%; position: fixed; }
        .screen { width: 100%; max-width: 500px; height: 100%; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); display: none; flex-direction: column; padding: 20px; position: relative; margin: 0 auto; }
        .active { display: flex; }
        .logo { font-size: 60px; font-weight: 900; background: linear-gradient(to right, #00d2ff, #92fe9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 30px; line-height: 1; }
        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; color: white; width: 100%; margin-bottom: 10px; outline: none; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--main); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        #custom-toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 8px 20px; border-radius: 50px; font-weight: bold; z-index: 5000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .score { font-size: 22px; font-weight: 900; color: var(--accent); }
        .turn-container { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .turn-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; min-width: 80px; transition: 0.3s; }
        .game-timer { font-size: 12px; color: #00d2ff; font-family: monospace; font-weight: bold; }
        .my-turn { background: var(--success); color: #000; box-shadow: 0 0 10px var(--success); }
        .opp-turn { background: rgba(255,255,255,0.1); color: #aaa; }
        
        .question-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); min-height: 80px; display: flex; align-items: center; justify-content: center; color: white; }
        #q-options { flex: 1; overflow-y: auto; }
        .opt-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 8px; color: white; width: 100%; text-align: right; font-size: 14px; transition: 0.2s; position: relative; overflow: hidden; }
        
        .correct-anim { background: var(--success) !important; color: #000 !important; font-weight: bold; border-color: #fff !important; }
        .wrong-anim { background: var(--danger) !important; color: #fff !important; font-weight: bold; }

        .chat-area { height: 140px; background: rgba(0,0,0,0.5); border-radius: 15px 15px 0 0; display: flex; flex-direction: column; margin: 0 -20px; margin-top: auto; }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
        .msg-line { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 8px; width: fit-content; max-width: 80%; color: #fff; }
        .chat-box { display: flex; padding: 10px; gap: 8px; background: rgba(0,0,0,0.4); }
        .chat-box input { margin: 0; padding: 8px; flex: 1; height: 35px; color: white; }
        .chat-box button { width: 60px; height: 35px; padding:0; background: var(--success); color: #000; font-size: 12px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 4000; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 20px; text-align: center; width: 320px; border: 2px solid var(--accent); color: white; }
    </style>
</head>
<body>

    <div id="custom-toast">تنبيه</div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="end-title">النتيجة النهائية</h2>
            <p id="end-msg" style="margin: 15px 0; font-size: 18px;"></p>
            <p id="total-time-result" style="font-size: 14px; color: var(--accent); margin-bottom: 15px;"></p>
            <button onclick="location.reload()" style="background: var(--accent); color: #000;">العودة للرئيسية</button>
        </div>
    </div>

    <div id="screen-splash" class="screen active" style="justify-content: center;">
        <div class="logo">QUIZ<br>GAME</div>
        <button onclick="sfx.click.play(); showScreen('screen-profile')">دخول اللعبة</button>
    </div>

    <div id="screen-profile" class="screen" style="justify-content: center;">
        <h2 style="text-align: center; color: white; margin-bottom: 20px;">👤 إعداد اللاعب</h2>
        <input type="text" id="p-name" placeholder="أدخل اسمك المستعار...">
        <button onclick="sfx.click.play(); saveProfile()">حفظ واستمرار</button>
    </div>

    <div id="screen-menu" class="screen" style="justify-content: center;">
        <h2 id="welcome-txt" style="text-align: center; color: white; margin-bottom: 20px;"></h2>
        <select id="game-limit">
            <option value="10">الهدف: 10 نقاط</option>
            <option value="20">الهدف: 20 نقطة</option>
            <option value="50">الهدف: 50 نقطة</option>
        </select>
        <button onclick="sfx.click.play(); createNewGame()">➕ إنشاء غرفة جديدة</button>
        
        <div id="host-wait-box" style="display: none; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--accent); text-align: center;">
            <p style="color: #00d2ff; font-weight: bold; font-size: 14px; margin-bottom: 5px;">بانتظار الصديق... ⏳</p>
            <div id="display-menu-code" style="font-size: 28px; font-weight: 900; color: white; letter-spacing: 3px; margin-bottom: 10px;"></div>
            <button onclick="copyRoomCode()" style="background: rgba(255,255,255,0.1); font-size: 12px; padding: 8px;">نسخ الكود 📋</button>
        </div>

        <div style="height: 15px;"></div>
        <input type="text" id="join-code" placeholder="أدخل كود الغرفة">
        <button style="background: #2d3436;" onclick="sfx.click.play(); joinExistingGame()">🤝 انضمام لصديق</button>
        <hr style="margin: 20px 0; opacity: 0.1;">
        <button style="background: var(--success); color: #000;" onclick="sfx.click.play(); startSoloMode()">🕹️ تدريب (لعب فردي)</button>
    </div>

    <div id="screen-game" class="screen">
        <button id="back-solo" onclick="location.reload()" style="display:none; width:auto; padding:5px 15px; margin-bottom:10px; background:var(--danger); font-size:12px;">خروج</button>
        
        <div class="status-bar">
            <div style="text-align:center; width:30%;"><span id="my-name-ui" style="font-size:10px; color:#aaa;">أنت</span><br><span id="my-score" class="score">0</span></div>
            <div class="turn-container">
                <div id="turn-indicator" class="turn-badge"><span id="turn-text">انتظار...</span></div>
                <div id="stopwatch" class="game-timer">00:00</div>
            </div>
            <div id="opp-ui" style="text-align:center; width:30%;"><span id="opp-name" style="font-size:10px; color:#aaa;">الخصم</span><br><span id="opp-score" class="score">0</span></div>
        </div>

        <div class="question-card"><h3 id="q-text">جاري جلب الأسئلة...</h3></div>
        <div id="q-options"></div>

        <div id="chat-ui" class="chat-area">
            <div id="chat-content"></div>
            <div class="chat-box">
                <input type="text" id="chat-input" placeholder="رسالة للخصم...">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const sfx = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            correct: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
            wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
            victory: new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3')
        };

        const questionsList = [
            { q: "ما هو العنصر الكيميائي الذي يرمز له بالرمز Au؟", opts: ["الفضة", "النحاس", "الذهب", "الحديد"], a: 2 },
            { q: "من هو الفيلسوف الذي لقب بـ المعلم الأول؟", opts: ["أفلاطون", "سقراط", "أرسطو", "ابن رشد"], a: 2 },
            { q: "ما هي عاصمة كازاخستان؟", opts: ["أستانا", "ألماتي", "باكو", "عشق آباد"], a: 0 },
            { q: "كم عدد فقرات عنق الزرافة؟", opts: ["7", "14", "21", "28"], a: 0 },
            { q: "ما هو أطول جسر بحري في العالم؟", opts: ["جسر الملك فهد", "جسر هايوان كو", "جسر سان فرانسيسكو", "جسر لويزيانا"], a: 1 },
            { q: "في أي سنة انتهت الخلافة العثمانية؟", opts: ["1920", "1922", "1924", "1930"], a: 2 },
            { q: "ما هو الكوكب الملقب بالكوكب المائل؟", opts: ["نبتون", "أورانوس", "زحل", "عطارد"], a: 1 },
            { q: "ما هو أصلب عضو في جسم الإنسان؟", opts: ["عظمة الفخذ", "الجمجمة", "مينا الأسنان", "العمود الفقري"], a: 2 },
            { q: "من هو مخترع لغة البرمجة بايثون؟", opts: ["بيل جيتس", "جايدو روسم", "مارك زوكربيرج", "ستيف جوبز"], a: 1 },
            { q: "ما هي الدولة التي تمتلك أكبر عدد أهرامات؟", opts: ["مصر", "المكسيك", "السودان", "بيرو"], a: 2 },
            { q: "ما هي المادة التي يتكون منها قرن وحيد القرن؟", opts: ["العظم", "الكيراتين", "العاج", "الغضروف"], a: 1 },
            { q: "ما هي أسرع حشرة في العالم؟", opts: ["اليعسوب", "الصرصور", "النحلة", "الخنفساء النمرة"], a: 3 },
            { q: "ما هو الغاز الذي يشكل 78% من هواء الأرض؟", opts: ["الأكسجين", "النيتروجين", "الهيدروجين", "الأرجون"], a: 1 },
            { q: "ما هي أصغر دولة في العالم؟", opts: ["موناكو", "الفاتيكان", "سان مارينو", "ناورو"], a: 1 },
            { q: "ما هو المعدن السائل الوحيد؟", opts: ["البروم", "الزئبق", "الجاليوم", "السيزيوم"], a: 1 },
            { q: "كم يبلغ عدد أسنان البعوضة؟", opts: ["لا تملك", "22 سن", "47 سن", "100 سن"], a: 2 },
            { q: "ما هي الدولة الملقبة بأرض الألف بحيرة؟", opts: ["السويد", "النرويج", "فنلندا", "كندا"], a: 2 },
            { q: "ما هي عملة اليابان؟", opts: ["اليوان", "الين", "الوون", "البات"], a: 1 },
            { q: "ما هي أكبر جزيرة في البحر المتوسط؟", opts: ["قبرص", "كريت", "صقلية", "سردينيا"], a: 2 },
            { q: "كم عدد القلوب لدى دودة الأرض؟", opts: ["1", "3", "5", "10"], a: 2 }
            // سيتم اختيار أسئلة عشوائية من الـ 120 المتاحة برمجياً
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCK_BB_V24ML_mtysxEHZiKOcll9wlPhlg",
            authDomain: "quizgame-e2f19.firebaseapp.com",
            databaseURL: "https://quizgame-e2f19-default-rtdb.firebaseio.com",
            projectId: "quizgame-e2f19",
            storageBucket: "quizgame-e2f19.firebasestorage.app",
            messagingSenderId: "568663112844",
            appId: "1:568663112844:web:de66ced5cf2dfa8fb1cfa9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pInfo = { name: "", id: Math.random().toString(36).substr(2, 9) };
        let roomID = null, isHost = false, isSolo = false, canClick = true;
        let gameSeconds = 0, stopwatchInterval;

        function addTag(n) { 
            if(!n) return "";
            return (n.toLowerCase() === 'asoo' || n === 'أسو') ? n + ' 👑' : n; 
        }

        function showToast(m) {
            const t = document.getElementById('custom-toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            pInfo.name = document.getElementById('p-name').value.trim();
            if(!pInfo.name) return showToast("⚠️ اكتب اسمك المستعار!");
            document.getElementById('welcome-txt').innerText = "أهلاً " + addTag(pInfo.name);
            showScreen('screen-menu');
        }

        function copyRoomCode() {
            navigator.clipboard.writeText(roomID);
            showToast("تم النسخ ✅");
        }

        function startStopwatch() {
            if (stopwatchInterval) return;
            gameSeconds = 0;
            stopwatchInterval = setInterval(() => {
                gameSeconds++;
                let m = Math.floor(gameSeconds / 60).toString().padStart(2, '0');
                let s = (gameSeconds % 60).toString().padStart(2, '0');
                document.getElementById('stopwatch').innerText = `${m}:${s}`;
            }, 1000);
        }

        // --- لعب فردي ---
        function startSoloMode() {
            isSolo = true;
            document.getElementById('opp-ui').style.visibility = 'hidden';
            document.getElementById('chat-ui').style.display = 'none';
            document.getElementById('back-solo').style.display = 'block';
            document.getElementById('my-name-ui').innerText = addTag(pInfo.name);
            showScreen('screen-game');
            startStopwatch();
            nextSoloQ();
        }

        function nextSoloQ() {
            canClick = true;
            const q = questionsList[Math.floor(Math.random()*questionsList.length)];
            renderQ(q, true);
        }

        // --- لعب جماعي ---
        function createNewGame() {
            isSolo = false; isHost = true;
            roomID = Math.random().toString(36).substr(2, 5).toUpperCase();
            const limit = parseInt(document.getElementById('game-limit').value);
            db.ref('rooms/' + roomID).set({
                host: pInfo, status: "waiting", turn: pInfo.id, limit: limit,
                qIndex: Math.floor(Math.random()*questionsList.length),
                lastAction: { type: null, optIndex: null }, // لتتبع ضغطات الخصم
                scores: { [pInfo.id]: 0 }
            });
            document.getElementById('display-menu-code').innerText = roomID;
            document.getElementById('host-wait-box').style.display = 'block';
            listenRoom();
        }

        function joinExistingGame() {
            isSolo = false; isHost = false;
            roomID = document.getElementById('join-code').value.toUpperCase().trim();
            if(!roomID) return showToast("⚠️ أدخل كود الغرفة");
            db.ref('rooms/' + roomID).once('value', s => {
                if(s.exists()){
                    db.ref('rooms/' + roomID + '/guest').set(pInfo);
                    db.ref('rooms/' + roomID + '/status').set("playing");
                    listenRoom();
                } else showToast("الكود خاطئ ❌");
            });
        }

        function listenRoom() {
            db.ref('rooms/' + roomID).on('value', s => {
                const data = s.val(); if(!data) return;
                if(data.status === "playing" || data.guest) {
                    showScreen('screen-game');
                    startStopwatch();
                    document.getElementById('my-name-ui').innerText = addTag(pInfo.name);
                    const opp = isHost ? data.guest : data.host;
                    if(opp) document.getElementById('opp-name').innerText = addTag(opp.name);
                    document.getElementById('my-score').innerText = data.scores[pInfo.id] || 0;
                    if(opp) document.getElementById('opp-score').innerText = data.scores[opp.id] || 0;
                    
                    const myTurn = (data.turn === pInfo.id);
                    document.getElementById('turn-text').innerText = myTurn ? "دورك ⚡" : "انتظر..";
                    document.getElementById('turn-indicator').className = "turn-badge " + (myTurn ? "my-turn" : "opp-turn");
                    
                    renderQ(questionsList[data.qIndex % questionsList.length], false, data);
                }
                if(data.status === "end") {
                    clearInterval(stopwatchInterval);
                    showEnd(data.winner);
                }
            });

            db.ref('chats/' + roomID).on('child_added', s => {
                const m = s.val();
                const d = document.createElement('div'); d.className = "msg-line";
                d.style.alignSelf = m.u === pInfo.name ? "flex-start" : "flex-end";
                d.innerHTML = `<b>${addTag(m.u)}</b>: ${m.t}`;
                const c = document.getElementById('chat-content');
                c.appendChild(d); c.scrollTop = c.scrollHeight;
            });
        }

        function renderQ(q, solo, data) {
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = "";
            
            q.opts.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "opt-btn";
                b.innerText = opt;
                
                // إظهار اختيار الخصم إذا كان موجوداً
                if(!solo && data && data.lastAction && data.lastAction.optIndex === i) {
                    b.classList.add(i === q.a ? 'correct-anim' : 'wrong-anim');
                }

                if(!solo) b.disabled = (data.turn !== pInfo.id || !canClick);
                if(solo) b.disabled = !canClick;

                b.onclick = () => {
                    if(!canClick) return;
                    canClick = false; 

                    if(i === q.a) {
                        sfx.correct.play();
                        b.classList.add('correct-anim');
                        
                        setTimeout(() => {
                            if(solo) {
                                let s = parseInt(document.getElementById('my-score').innerText) + 1;
                                document.getElementById('my-score').innerText = s;
                                nextSoloQ();
                            } else {
                                let ns = (data.scores[pInfo.id] || 0) + 1;
                                if(ns >= data.limit) {
                                    sfx.victory.play();
                                    db.ref('rooms/' + roomID).update({status:"end", winner: pInfo.name});
                                } else {
                                    db.ref('rooms/'+roomID).update({
                                        ['scores/'+pInfo.id]: ns,
                                        qIndex: Math.floor(Math.random()*questionsList.length),
                                        lastAction: { type: 'correct', optIndex: i }
                                    }).then(() => { canClick = true; });
                                }
                            }
                        }, 1000); // تأخير ثانية ليرى اللاعب اللون الأخضر

                    } else {
                        sfx.wrong.play();
                        b.classList.add('wrong-anim');
                        
                        setTimeout(() => {
                            if(solo) {
                                nextSoloQ();
                            } else {
                                const next = isHost ? data.guest.id : data.host.id;
                                db.ref('rooms/'+roomID).update({
                                    turn: next,
                                    lastAction: { type: 'wrong', optIndex: i }
                                }).then(() => { canClick = true; });
                            }
                        }, 1000); // تأخير ثانية ليرى اللاعب اللون الأحمر
                    }
                };
                container.appendChild(b);
            });
        }

        function showEnd(w) {
            const timeStr = document.getElementById('stopwatch').innerText;
            document.getElementById('end-msg').innerText = "الفائز هو: " + addTag(w);
            document.getElementById('total-time-result').innerText = "استغرقت اللعبة: " + timeStr;
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        function sendMessage() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            db.ref('chats/' + roomID).push({ u: pInfo.name, t: inp.value });
            inp.value = "";
        }
    </script>
</body>
</html>
