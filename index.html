<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>كويز قيم PRO - أذكى لعبة أسئلة أونلاين</title>
    <meta name="description" content="العب كويز قيم PRO، تحدى أصدقاءك في أقوى لعبة أسئلة ومعلومات عامة أونلاين مجاناً.">
    <meta name="keywords" content="كويز قيم, كويز جيم, quiz game pro, لعبة أسئلة, تحدي معلومات, ألعاب متصفح">
    <meta name="author" content="Alharbiia015">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3407/3407024.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --main: #6c5ce7; --bg: #0f0c29; --accent: #00d2ff; --white: #ffffff; --success: #00b894; --danger: #ff7675; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body { background: var(--bg); height: 100%; overflow: hidden; width: 100%; position: fixed; }

        .screen { width: 100%; max-width: 500px; height: 100%; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); display: none; flex-direction: column; padding: 20px; position: relative; margin: 0 auto; }
        .active { display: flex; }

        .logo { font-size: 60px; font-weight: 900; background: linear-gradient(to right, #00d2ff, #92fe9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 30px; line-height: 1; }
        
        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; color: white; width: 100%; margin-bottom: 10px; outline: none; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--main); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }

        #custom-toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 8px 20px; border-radius: 50px; font-weight: bold; z-index: 5000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .score { font-size: 22px; font-weight: 900; color: var(--accent); }
        .turn-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; text-align: center; min-width: 80px; }
        .my-turn { background: var(--success); color: #000; }
        .opp-turn { background: rgba(255,255,255,0.1); color: #aaa; }

        .question-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); min-height: 80px; display: flex; align-items: center; justify-content: center; color: #ffffff !important; }
        .question-card h3 { color: #ffffff !important; }

        #q-options { flex: 1; overflow-y: auto; margin-bottom: 10px; padding-right: 5px; }
        .opt-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 8px; color: white; width: 100%; text-align: right; font-size: 14px; transition: 0.3s; }
        .opt-btn:disabled { cursor: not-allowed; }

        .chat-area { height: 160px; background: rgba(0,0,0,0.5); border-radius: 15px 15px 0 0; display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 -20px; margin-top: auto; padding-bottom: env(safe-area-inset-bottom); }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
        .msg-line { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; width: fit-content; max-width: 80%; color: #fff; }
        .chat-box { display: flex; padding: 10px; gap: 8px; background: rgba(0,0,0,0.4); }
        .chat-box input { margin: 0; padding: 8px; font-size: 13px; flex: 1; height: 40px; color: white; }
        .chat-box button { width: 70px; padding: 0; height: 40px; font-size: 13px; background: var(--success); color: #000; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 2px solid var(--accent); color: white; }
    </style>
</head>
<body>

    <div id="custom-toast">تنبيه</div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="end-title" style="font-size: 24px;">النتيجة</h2>
            <p id="end-msg" style="margin: 15px 0; color: #ccc; font-size: 18px;"></p>
            <p id="total-time" style="font-size: 14px; margin-bottom: 20px; color: var(--accent);"></p>
            <button onclick="location.reload()" style="background: var(--accent); color: #000;">الرئيسية</button>
        </div>
    </div>

    <div id="screen-splash" class="screen active" style="justify-content: center;">
        <div class="logo">QUIZ<br>GAME</div>
        <button onclick="sfx.click.play(); showScreen('screen-profile')">دخول اللعبة</button>
    </div>

    <div id="screen-profile" class="screen" style="justify-content: center;">
        <h2 style="text-align: center; margin-bottom: 20px; color: white;">👤 إعداد اللاعب</h2>
        <input type="text" id="p-name" placeholder="أدخل اسمك المستعار">
        <button onclick="sfx.click.play(); saveProfile()">حفظ واستمرار</button>
    </div>

    <div id="screen-menu" class="screen" style="justify-content: center;">
        <h2 id="welcome-txt" style="margin-bottom: 20px; text-align: center; color: white;">أهلاً بك</h2>
        <div id="room-code-display" style="display:none; text-align:center; margin-bottom:15px; padding:15px; border:1px dashed var(--accent); border-radius:12px; background: rgba(0,210,255,0.05);">
            <span style="font-size: 12px; color: #aaa;">كود الغرفة</span><br>
            <b id="display-code" style="font-size: 28px; color: var(--accent); letter-spacing: 2px;">----</b>
            <button style="width:auto; padding:5px 15px; font-size: 12px; margin-top:10px;" onclick="copyCode()">📋 نسخ الكود</button>
        </div>
        <select id="game-limit">
            <option value="10">تحديد المستوى: 10 نقاط</option>
            <option value="20">تحديد المستوى: 20 نقطة</option>
            <option value="50">تحديد المستوى: 50 نقطة</option>
        </select>
        <button onclick="sfx.click.play(); createNewGame()">➕ إنشاء غرفة جديدة</button>
        <div style="height: 15px;"></div>
        <input type="text" id="join-code" placeholder="أدخل كود الصديق">
        <button style="background: #2d3436;" onclick="sfx.click.play(); joinExistingGame()">🤝 انضمام لغرفة</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="status-bar">
            <div style="text-align:center; width: 30%;"><span id="my-name" style="font-size:10px; color:#aaa; display:block; overflow:hidden;">أنت</span><span id="my-score" class="score">0</span></div>
            <div id="turn-indicator" class="turn-badge">
                <span id="turn-text" style="display:block;">...</span>
                <span id="game-timer" style="font-size: 9px; color: #fff;">00:00</span>
            </div>
            <div style="text-align:center; width: 30%;"><span id="opp-name" style="font-size:10px; color:#aaa; display:block; overflow:hidden;">الخصم</span><span id="opp-score" class="score">0</span></div>
        </div>
        <div class="question-card"><h3 id="q-text" style="font-size: 16px; color: white;">جاري التحميل...</h3></div>
        <div id="q-options"></div>
        <div class="chat-area">
            <div id="chat-content"></div>
            <div class="chat-box">
                <input type="text" id="chat-input" placeholder="رسالة..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // بنك الأسئلة المحدث
        const questionsList = [
            { q: "ما هو العنصر الكيميائي الأكثر وفرة في الكون؟", opts: ["الأكسجين", "الهيدروجين", "الهيليوم", "النيتروجين"], a: 1 },
            { q: "من هو القائد المسلم الذي فتح الأندلس؟", opts: ["صلاح الدين الأيوبي", "طارق بن زياد", "خالد بن الوليد", "عمرو بن العاص"], a: 1 },
            { q: "ما هي عاصمة الإمبراطورية البيزنطية؟", opts: ["روما", "أثينا", "القسطنطينية", "الإسكندرية"], a: 2 },
            { q: "كم عدد صمامات قلب الإنسان؟", opts: ["2", "3", "4", "5"], a: 2 },
            { q: "أين تقع أعمق نقطة في محيطات العالم؟", opts: ["خندق ماريانا", "خندق تونغا", "خندق بورتوريكو", "خندق جاوة"], a: 0 },
            { q: "ما هي الدولة التي تسمى أرض الشمس المشرقة؟", opts: ["الصين", "كوريا", "اليابان", "تايلاند"], a: 2 },
            { q: "ما هي عملة دولة فيتنام؟", opts: ["دونغ", "ين", "بات", "ريال"], a: 0 },
            { q: "من هو مكتشف الدورة الدموية الكبرى؟", opts: ["ابن النفيس", "ويليام هارفي", "باستير", "أبو بكر الرازي"], a: 1 },
            { q: "ما هو أصلب مادة طبيعية في الأرض؟", opts: ["الحديد", "الألماس", "الكوارتز", "التيتانيوم"], a: 1 },
            { q: "كم يبلغ عدد أسنان الشخص البالغ؟", opts: ["28", "30", "32", "34"], a: 2 },
            { q: "ما هو أكبر كوكب في المجموعة الشمسية؟", opts: ["زحل", "المشتري", "نبتون", "الأرض"], a: 1 },
            { q: "في أي عام بدأت الحرب العالمية الأولى؟", opts: ["1912", "1914", "1918", "1939"], a: 1 },
            { q: "من هو الرسام صاحب لوحة 'الموناليزا'؟", opts: ["بيكاسو", "دالي", "دافينشي", "فان جوخ"], a: 2 },
            { q: "ما هو الغاز الذي تطلقه النباتات في النهار؟", opts: ["ثاني أكسيد الكربون", "الأكسجين", "الهيدروجين", "النيتروجين"], a: 1 },
            { q: "ما هي أصغر قارة في العالم من حيث المساحة؟", opts: ["أوروبا", "أستراليا", "أفريقيا", "أمريكا الجنوبية"], a: 1 },
            { q: "من هو مؤلف كتاب 'مقدمة ابن خلدون'؟", opts: ["ابن رشد", "ابن خلدون", "ابن بطوطة", "ابن سينا"], a: 1 },
            { q: "ما هي الدولة التي فازت بأول مونديال في التاريخ عام 1930؟", opts: ["البرازيل", "الأرجنتين", "الأوروغواي", "إيطاليا"], a: 2 },
            { q: "ما هو العلم الذي يدرس طبقات الأرض؟", opts: ["الجيولوجيا", "البيولوجيا", "الكيمياء", "الفلك"], a: 0 },
            { q: "كم عدد ألوان قوس قزح؟", opts: ["5", "6", "7", "8"], a: 2 },
            { q: "ما هي عاصمة كندا؟", opts: ["تورونتو", "مونتريال", "أوتاوا", "فانكوفر"], a: 2 },
            { q: "ما هو أطول سور في العالم؟", opts: ["سور برلين", "سور الصين العظيم", "سور القسطنطينية", "سور بغداد"], a: 1 },
            { q: "ما هو الكوكب الذي يلقب بـ 'توأم الأرض'؟", opts: ["المريخ", "الزهرة", "عطارد", "زحل"], a: 1 },
            { q: "من هو أول إنسان صعد إلى الفضاء؟", opts: ["نيل أرمسترونج", "يوري غاغارين", "بين آلدن", "أليكسي ليونوف"], a: 1 },
            { q: "ما هي أكبر صحراء في العالم؟", opts: ["الصحراء الكبرى", "صحراء الربع الخالي", "القارة القطبية الجنوبية", "صحراء غوبي"], a: 2 },
            { q: "في أي قارة تقع دولة البرازيل؟", opts: ["أمريكا الشمالية", "أمريكا الجنوبية", "أفريقيا", "أوروبا"], a: 1 },
            { q: "ما هي عاصمة روسيا؟", opts: ["سان بطرسبرج", "موسكو", "كييف", "قازان"], a: 1 },
            { q: "ما هي العملة المستخدمة في سويسرا؟", opts: ["اليورو", "الجنيه الاسترليني", "الفرنك السويسري", "الدولار"], a: 2 },
            { q: "كم عدد القلوب لدى الأخطبوط؟", opts: ["1", "2", "3", "4"], a: 2 },
            { q: "ما هو الاسم العلمي للماء؟", opts: ["CO2", "NaCl", "H2O", "O2"], a: 2 },
            { q: "من هو مخترع الهاتف؟", opts: ["أديسون", "ألكسندر غراهام بيل", "تسلا", "نيوتن"], a: 1 },
            { q: "ما هي عاصمة إسبانيا؟", opts: ["برشلونة", "مدريد", "إشبيلية", "فالنسيا"], a: 1 },
            { q: "ما هو المعدن السائل في درجة حرارة الغرفة؟", opts: ["الحديد", "النحاس", "الزئبق", "الرصاص"], a: 2 },
            { q: "أين يوجد تمثال الحرية؟", opts: ["واشنطن", "نيويورك", "باريس", "لندن"], a: 1 },
            { q: "كم عدد القارات في العالم؟", opts: ["5", "6", "7", "8"], a: 2 },
            { q: "ما هو أطول نهر في أوروبا؟", opts: ["الدانوب", "الراين", "الفولغا", "السين"], a: 2 },
            { q: "في أي مدينة يقع مقر الأمم المتحدة؟", opts: ["جنيف", "نيويورك", "باريس", "فيينا"], a: 1 },
            { q: "ما هو الطائر الذي يضع أكبر بيضة في العالم؟", opts: ["النسر", "النعامة", "البوم", "البجعة"], a: 1 },
            { q: "ما هي الدولة التي لديها أكبر عدد سكان في العالم حالياً؟", opts: ["الصين", "الهند", "أمريكا", "إندونيسيا"], a: 1 },
            { q: "ما هو أسرع حيوان بري في العالم؟", opts: ["الأسد", "النمر", "الفهد الصياد", "الغزال"], a: 2 },
            { q: "ما هو البحر الذي يفصل بين قارتي أفريقيا وأوروبا؟", opts: ["البحر الأحمر", "البحر الميت", "البحر المتوسط", "البحر الأسود"], a: 2 },
            { q: "ما هي عاصمة إيطاليا؟", opts: ["ميلانو", "فينيسيا", "فلورنسا", "روما"], a: 3 },
            { q: "من هو مكتشف الجاذبية الأرضية؟", opts: ["إينشتاين", "نيوتن", "جاليليو", "أرخميدس"], a: 1 },
            { q: "كم عدد العظام في جسم الإنسان البالغ؟", opts: ["200", "206", "210", "215"], a: 1 },
            { q: "ما هي عاصمة تركيا؟", opts: ["إسطنبول", "أنقرة", "إزمير", "أنطاليا"], a: 1 },
            { q: "ما هي السورة التي تسمى عروس القرآن؟", opts: ["يس", "الرحمن", "البقرة", "الملك"], a: 1 },
            { q: "كم عدد أسنان الجمل؟", opts: ["32", "34", "36", "38"], a: 1 },
            { q: "من هو الصحابي الملقب بـ أسد الله؟", opts: ["عمر بن الخطاب", "علي بن أبي طالب", "حمزة بن عبدالمطلب", "خالد بن الوليد"], a: 2 },
            { q: "ما هو الغاز المستخدم في إطفاء الحرائق؟", opts: ["الأكسجين", "النيتروجين", "ثاني أكسيد الكربون", "الهيليوم"], a: 2 },
            { q: "ما هو الحيوان الذي ينام وعين واحدة مفتوحة؟", opts: ["الدلفين", "القرش", "التمساح", "الحوت"], a: 0 },
            { q: "ما هي الدولة العربية التي يمر بها خط الاستواء؟", opts: ["السودان", "الصومال", "اليمن", "موريتانيا"], a: 1 },
            { q: "ما هو أطول نهر في العالم العربي؟", opts: ["الفرات", "دجلة", "النيل", "أم الربيع"], a: 2 },
            { q: "من هو مكتشف البنسلين؟", opts: ["ألكسندر فليمنج", "لويس باستير", "ألبرت أينشتاين", "ماري كوري"], a: 0 },
            { q: "ما هو الموطن الأصلي لشجرة الكاكاو؟", opts: ["أفريقيا", "أمريكا الجنوبية", "آسيا", "أوروبا"], a: 1 },
            { q: "كم عدد جيوب الأنفية في الإنسان؟", opts: ["4", "6", "8", "10"], a: 2 },
            { q: "من هو باني مدينة بغداد؟", opts: ["هارون الرشيد", "أبو جعفر المنصور", "المأمون", "الأمين"], a: 1 },
            { q: "ما هي عاصمة أستراليا؟", opts: ["سيدني", "ملبورن", "كانبيرا", "بيرث"], a: 2 },
            { q: "ما هي المادة التي تشكل 80% من حجم الدماغ البشري؟", opts: ["الدهون", "البروتين", "الماء", "الكالسيوم"], a: 2 },
            { q: "من هو مؤلف كتاب البخلاء؟", opts: ["الجاحظ", "المتنبي", "الفرزدق", "ابن المقفع"], a: 0 },
            { q: "ما هي أعمق بحيرة في العالم؟", opts: ["بحيرة فيكتوريا", "بحيرة بايكال", "بحيرة سوبيريور", "البحر الميت"], a: 1 },
            { q: "من هو النبي الذي ابتلعه الحوت؟", opts: ["يونس", "يعقوب", "أيوب", "يوسف"], a: 0 },
            { q: "ما هي لغة البرازيل الرسمية؟", opts: ["الإسبانية", "البرتغالية", "الإنجليزية", "الفرنسية"], a: 1 },
            { q: "ما هو الحيوان الذي لا يشرب الماء طوال حياته؟", opts: ["الجمل", "الفأر الكنغري", "الزرافة", "الثعلب"], a: 1 },
            { q: "في أي عام تم افتتاح قناة السويس؟", opts: ["1850", "1869", "1880", "1900"], a: 1 },
            { q: "ما هي عاصمة كوريا الجنوبية؟", opts: ["بيونغ يانغ", "طوكيو", "سيول", "مانيلا"], a: 2 },
            { q: "ما هي عملة بريطانيا؟", opts: ["اليورو", "الجنيه الإسترليني", "الدولار", "الفرنك"], a: 1 },
            { q: "كم عدد دقات قلب الفأر في الدقيقة؟", opts: ["100", "200", "500", "500+"], a: 3 },
            { q: "ما هو المعدن الأغلى في العالم؟", opts: ["الذهب", "البلاتين", "الروديوم", "الفضة"], a: 2 },
            { q: "ما هي أكبر جزيرة في العالم؟", opts: ["مدغشقر", "جرينلاند", "غينيا الجديدة", "بورنيو"], a: 1 },
            { q: "ما هي الشجرة التي ذكرت في القرآن بأنها ملعونة؟", opts: ["الزيتون", "التين", "الزقوم", "السدر"], a: 2 },
            { q: "ما هو أقرب كوكب إلى الأرض؟", opts: ["المريخ", "عطارد", "الزهرة", "المشتري"], a: 2 },
            { q: "كم عدد سور القرآن الكريم؟", opts: ["110", "112", "114", "116"], a: 2 },
            { q: "من هو مؤسس علم الجبر؟", opts: ["الخوارزمي", "ابن سينا", "جابر بن حيان", "البيروني"], a: 0 },

            { q: "ما هي لغة النمسا الرسمية؟", opts: ["الإنجليزية", "الفرنسية", "الألمانية", "النمساوية"], a: 2 },
            { q: "ما هو الحيوان الملقب بـ أم قشعم؟", opts: ["الضبع", "أنثى الأسد", "النسر", "أنثى الفيل"], a: 2 },
            { q: "ما هو البحر الذي لا توجد فيه أي كائنات حية؟", opts: ["البحر الأحمر", "البحر الميت", "بحر قزوين", "البحر الأسود"], a: 1 },
            { q: "ما هي أكبر غدة في جسم الإنسان؟", opts: ["الغدة الدرقية", "الكبد", "البنكرياس", "الغدة النخامية"], a: 1 },

            { q: "من هو الشاعر الملقب بـ أمير الشعراء؟", opts: ["أحمد شوقي", "حافظ إبراهيم", "المتنبي", "نزار قباني"], a: 0 },
            { q: "ما هو الغاز الذي يشكل معظم الغلاف الجوي للأرض؟", opts: ["الأكسجين", "النيتروجين", "ثاني أكسيد الكربون", "الهيدروجين"], a: 1 },

            { q: "ما هي عاصمة الصين؟", opts: ["شنغهاي", "هونغ كونغ", "بكين", "ووهان"], a: 2 },
            { q: "كم عدد الخلفاء الراشدين؟", opts: ["3", "4", "5", "6"], a: 1 },
            { q: "ما هو أشد العناصر الكيميائية سمية؟", opts: ["الزرنيخ", "البلوتونيوم", "السارين", "السيانيد"], a: 1 },
            { q: "أين يوجد أكبر هرم في العالم؟", opts: ["مصر", "السودان", "المكسيك", "الصين"], a: 2 },
            { q: "ما هي عاصمة باكستان؟", opts: ["كراتشي", "إسلام آباد", "لاهور", "بيشاور"], a: 1 },
            { q: "ما هو أول مسجد بني في الإسلام؟", opts: ["المسجد النبوي", "المسجد الحرام", "مسجد قباء", "المسجد الأقصى"], a: 2 },
            { q: "ما هي المادة التي تمنح الجلد لونه؟", opts: ["الكيراتين", "الميلانين", "الكولاجين", "الهيموجلوبين"], a: 1 },
            { q: "من هو مخترع المصباح الكهربائي؟", opts: ["توماس إديسون", "نيكولا تسلا", "ألبرت أينشتاين", "جراهام بيل"], a: 0 },
            { q: "ما هو أكبر محيط في العالم؟", opts: ["المحيط الأطلسي", "المحيط الهندي", "المحيط الهادئ", "المحيط المتجمد الشمالي"], a: 2 },
            { q: "ما هي عاصمة سويسرا؟", opts: ["جنيف", "زيورخ", "برن", "بازل"], a: 2 },
            { q: "كم عدد آيات سورة البقرة؟", opts: ["285", "286", "287", "288"], a: 1 },
            { q: "ما هي فصيلة الدم التي تعتبر مانحاً عاماً؟", opts: ["A+", "B-", "O-", "AB+"], a: 2 }
        ];

        const sfx = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            correct: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
            wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
            victory: new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3')
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCK_BB_V24ML_mtysxEHZiKOcll9wlPhlg",
            authDomain: "quizgame-e2f19.firebaseapp.com",
            databaseURL: "https://quizgame-e2f19-default-rtdb.firebaseio.com",
            projectId: "quizgame-e2f19",
            storageBucket: "quizgame-e2f19.firebasestorage.app",
            messagingSenderId: "568663112844",
            appId: "1:568663112844:web:de66ced5cf2dfa8fb1cfa9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerInfo = { name: "", id: Math.random().toString(36).substr(2, 9) };
        let roomID = null, isHost = false, myTurn = false;
        let timerInterval = null, startTime = null;
        window.revealTimeout = null;

        // دالة لاكتشاف اسم Asoo وإضافة التاج
        function addTag(name) {
            if (!name) return "";
            if (name.trim().toLowerCase() === 'asoo' || name.trim() === 'أسو') {
                return name + ' 👑';
            }
            return name;
        }

        function showToast(msg) {
            const t = document.getElementById('custom-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            playerInfo.name = document.getElementById('p-name').value.trim();
            if(!playerInfo.name) return showToast("⚠️ اكتب اسمك أولاً");
            document.getElementById('welcome-txt').innerText = `أهلاً بك ${addTag(playerInfo.name)}`;
            document.getElementById('my-name').innerText = addTag(playerInfo.name);
            showScreen('screen-menu');
        }

        function createNewGame() {
            roomID = Math.random().toString(36).substr(2, 5).toUpperCase();
            isHost = true;
            document.getElementById('room-code-display').style.display = 'block';
            document.getElementById('display-code').innerText = roomID;
            
            // خوارزمية (Fisher-Yates) وتحويلها لنص لمنع أخطاء اختلاف النسخ والمزامنة بين الأجهزة
            let order = questionsList.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }

            const targetScore = parseInt(document.getElementById('game-limit').value);
            db.ref('rooms/' + roomID).set({
                host: playerInfo, turn: playerInfo.id, qIndex: 0,
                scores: { [playerInfo.id]: 0 }, status: "waiting", limit: targetScore,
                qOrderStr: order.join(','), selectedOption: null
            });
            listenToRoom();
        }

        function joinExistingGame() {
            roomID = document.getElementById('join-code').value.toUpperCase().trim();
            if(!roomID) return showToast("⚠️ أدخل الكود");
            db.ref('rooms/' + roomID).once('value', snapshot => {
                if(snapshot.exists()) {
                    isHost = false;
                    db.ref('rooms/' + roomID + '/guest').set(playerInfo);
                    db.ref('rooms/' + roomID + '/scores/' + playerInfo.id).set(0);
                    db.ref('rooms/' + roomID + '/status').set("playing");
                    listenToRoom();
                } else { showToast("❌ كود خاطئ"); }
            });
        }

        function listenToRoom() {
            db.ref('rooms/' + roomID).on('value', snapshot => {
                const data = snapshot.val(); if(!data) return;
                
                if(data.status === "finished") { 
                    clearInterval(timerInterval); 
                    showEndModal(addTag(data.winnerName)); 
                    return; 
                }
                if(data.status === "playing") {
                    showScreen('screen-game');
                    if(!startTime) { startTime = Date.now(); startTimer(); }
                }
                if(data.scores) {
                    Object.keys(data.scores).forEach(id => {
                        document.getElementById(id === playerInfo.id ? 'my-score' : 'opp-score').innerText = data.scores[id];
                    });
                }
                if(data.guest && data.host) {
                    document.getElementById('opp-name').innerText = isHost ? addTag(data.guest.name) : addTag(data.host.name);
                }
                myTurn = (data.turn === playerInfo.id);
                document.getElementById('turn-text').innerText = myTurn ? "دورك الآن ⚡" : "انتظر الخصم";
                document.getElementById('turn-indicator').className = "turn-badge " + (myTurn ? "my-turn" : "opp-turn");

                // استخراج ترتيب الأسئلة بأمان تام
                if(data.qOrderStr) {
                    const orderArr = data.qOrderStr.split(',').map(Number);
                    let q = questionsList[orderArr[data.qIndex % orderArr.length]];
                    if (!q) q = questionsList[0]; // حماية إضافية للذاكرة المؤقتة
                    updateUI(q, data);
                }
            });

            db.ref('chats/' + roomID).on('child_added', s => {
                const m = s.val();
                const d = document.createElement('div'); d.className = "msg-line";
                d.style.alignSelf = m.user === playerInfo.name ? "flex-start" : "flex-end";
                d.innerHTML = `<b style="color:var(--accent); font-size:10px;">${addTag(m.user)}</b><br>${m.text}`;
                const content = document.getElementById('chat-content');
                content.appendChild(d); content.scrollTop = content.scrollHeight;
            });
        }

        function updateUI(q, data) {
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options'); 
            container.innerHTML = "";
            
            q.opts.forEach((opt, i) => {
                const b = document.createElement('button'); 
                b.className = "opt-btn";
                b.innerText = opt; 
                
                // إذا تم اختيار إجابة للتو، اعرضها للجميع
                if (data.selectedOption !== undefined && data.selectedOption !== null) {
                    b.disabled = true;
                    if (i === data.selectedOption) {
                        if (data.isCorrect) {
                            b.style.backgroundColor = "var(--success)"; // أخضر
                            b.style.borderColor = "var(--success)";
                        } else {
                            b.style.backgroundColor = "var(--danger)"; // أحمر
                            b.style.borderColor = "var(--danger)";
                        }
                        b.style.color = "#000";
                        b.style.opacity = "1";
                    }
                } else {
                    b.disabled = !myTurn;
                    b.onclick = () => {
                        sfx.click.play();
                        const isCorrect = (i === q.a);
                        // نرسل الاختيار ونتيجته ليراه الجميع
                        db.ref('rooms/' + roomID).update({ 
                            selectedOption: i,
                            isCorrect: isCorrect
                        });
                        
                        if (isCorrect) {
                            sfx.correct.play();
                            showToast("✅ إجابة صحيحة!");
                        } else {
                            sfx.wrong.play();
                            showToast("❌ إجابة خاطئة!");
                        }
                    };
                }
                container.appendChild(b);
            });

            // مؤقت الانتقال (خاص باللاعب الذي أجاب فقط لمنع التكرار)
            if (data.selectedOption !== undefined && data.selectedOption !== null && myTurn) {
                if (!window.revealTimeout) {
                    window.revealTimeout = setTimeout(() => {
                        window.revealTimeout = null;
                        
                        if (data.isCorrect) {
                            const ns = (data.scores[playerInfo.id] || 0) + 1;
                            if(ns >= data.limit) {
                                db.ref('rooms/' + roomID).update({ selectedOption: null, status: "finished", winnerName: playerInfo.name });
                                db.ref('rooms/' + roomID + '/scores/' + playerInfo.id).set(ns);
                            } else {
                                db.ref('rooms/' + roomID).update({ selectedOption: null, qIndex: (data.qIndex || 0) + 1 });
                                db.ref('rooms/' + roomID + '/scores/' + playerInfo.id).set(ns);
                            }
                        } else {
                            const next = isHost ? (data.guest ? data.guest.id : data.host.id) : data.host.id;
                            db.ref('rooms/' + roomID).update({ selectedOption: null, turn: next });
                        }
                    }, 2000);
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(diff / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                document.getElementById('game-timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function sendMessage() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            sfx.click.play();
            db.ref('chats/' + roomID).push({ user: playerInfo.name, text: inp.value });
            inp.value = "";
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('display-code').innerText);
            showToast("✅ تم نسخ الكود!");
        }

        function showEndModal(winnerName) {
            sfx.victory.play();
            document.getElementById('end-title').innerText = winnerName.includes(playerInfo.name) ? "🏆 فزت بالمباراة!" : "💔 حظاً أوفر";
            document.getElementById('end-msg').innerText = "الفائز هو: " + winnerName;
            document.getElementById('total-time').innerText = "مدة المباراة: " + document.getElementById('game-timer').innerText;
            document.getElementById('game-over-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
